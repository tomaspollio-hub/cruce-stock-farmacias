<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmacias Global — Usuarios</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

<header class="header">
  <div class="header-logo"><a href="index.html" style="display:flex;align-items:center;text-decoration:none"><img src="/img/logo-global.png" alt="Farmacias Global" style="height:44px;width:auto"></a>
  </div>
  <nav class="header-nav">
    <a href="index.html">Dashboard</a>
    <a href="nuevo-cruce.html">Nuevo cruce</a>
    <a href="operador.html">Operador</a>
    <a href="historial.html">Historial</a>
    <a href="usuarios.html" class="active">Usuarios</a>
    <a href="config.html">Config</a>
  </nav>
  <div class="header-spacer"></div>
  <div class="header-user">
    <div class="header-user-avatar" id="user-avatar">–</div>
    <span id="user-nombre"></span>
    <button class="btn btn-ghost btn-sm" id="logout-btn">Salir</button>
  </div>
</header>

<main class="main">

  <div class="page-header" style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:var(--space-4)">
    <div>
      <h1 class="page-title">Usuarios</h1>
      <p class="page-subtitle">Administrá el acceso al sistema</p>
    </div>
    <button class="btn btn-primary" id="btn-nuevo">+ Nuevo usuario</button>
  </div>

  <div class="card">
    <div id="usuarios-content">
      <div class="empty-state">
        <div class="spinner" style="width:32px;height:32px;border-width:3px;margin:0 auto var(--space-4)"></div>
        <div>Cargando...</div>
      </div>
    </div>
  </div>

</main>

<div id="toast-container"></div>

<!-- Modal crear/editar usuario -->
<div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;align-items:center;justify-content:center">
  <div style="background:var(--bg-card);border-radius:var(--radius-xl);padding:var(--space-6);max-width:440px;width:94%;box-shadow:var(--shadow-xl)">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-5)">
      <h3 style="font-size:var(--text-lg);font-weight:var(--font-semibold)" id="modal-title">Nuevo usuario</h3>
      <button class="btn btn-ghost btn-sm btn-icon" id="modal-close"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>

    <div style="display:flex;flex-direction:column;gap:var(--space-4)">
      <div id="campo-usuario">
        <label class="form-label">Usuario <span style="color:var(--danger)">*</span></label>
        <input class="form-input" id="f-usuario" placeholder="nombre de usuario" autocomplete="off">
      </div>
      <div>
        <label class="form-label">Nombre</label>
        <input class="form-input" id="f-nombre" placeholder="Nombre completo">
      </div>
      <div>
        <label class="form-label" id="pwd-label">Contraseña <span style="color:var(--danger)">*</span></label>
        <input class="form-input" id="f-password" type="password" placeholder="Contraseña" autocomplete="new-password">
        <p id="pwd-hint" style="font-size:var(--text-xs);color:var(--text-muted);margin-top:4px;display:none">
          Dejá vacío para no cambiar la contraseña
        </p>
      </div>
      <div>
        <label class="form-label">Rol <span style="color:var(--danger)">*</span></label>
        <select class="form-select" id="f-rol">
          <option value="operador">Operador</option>
          <option value="cadete">Cadete</option>
          <option value="admin">Admin</option>
        </select>
      </div>
    </div>

    <div style="display:flex;gap:var(--space-3);justify-content:flex-end;margin-top:var(--space-6)">
      <button class="btn btn-ghost" id="modal-cancel">Cancelar</button>
      <button class="btn btn-primary" id="modal-confirm">Crear</button>
    </div>
  </div>
</div>

<script type="module">
  import auth from './js/auth.js';
  import { showToast } from './js/toast.js';
  import { initMobileNav } from './js/mobile-nav.js';

  const session = await auth.requireAuth();
  if (!session) throw new Error('sin sesion');
  if (session.rol !== 'admin') { window.location.href = 'index.html'; }

  document.getElementById('user-nombre').textContent = session.nombre || session.usuario;
  document.getElementById('user-avatar').textContent =
    (session.nombre || session.usuario).charAt(0).toUpperCase();
  document.getElementById('logout-btn').addEventListener('click', () => auth.logout());
  initMobileNav('usuarios', session.rol);

  const ROL_BADGE = { admin: 'badge-red', operador: 'badge-blue', cadete: 'badge-green' };
  const ROL_LABEL = { admin: 'Admin', operador: 'Operador', cadete: 'Cadete' };

  let editandoId = null;

  // ── Render tabla ──────────────────────────────────────────────
  async function cargar() {
    const res  = await auth.apiFetch('/api/usuarios');
    const data = await res.json();
    if (!data.ok) {
      showToast('Error al cargar usuarios', 'error');
      return;
    }

    const filas = data.usuarios.map(u => {
      const badge = ROL_BADGE[u.rol] ?? 'badge-gray';
      const esSelf = u.id === session.id;
      return `
        <tr>
          <td style="font-weight:var(--font-medium)">${u.usuario}</td>
          <td>${u.nombre || '—'}</td>
          <td><span class="badge ${badge}">${ROL_LABEL[u.rol] ?? u.rol}</span></td>
          <td style="font-size:var(--text-xs);color:var(--text-muted)">
            ${new Date(u.created_at).toLocaleDateString('es-AR')}
          </td>
          <td>
            <div style="display:flex;gap:var(--space-2)">
              <button class="btn btn-ghost btn-sm" data-edit="${u.id}">Editar</button>
              ${esSelf ? '' : `<button class="btn btn-ghost btn-sm" style="color:var(--danger)" data-del="${u.id}" data-nombre="${u.usuario}">Eliminar</button>`}
            </div>
          </td>
        </tr>`;
    }).join('');

    document.getElementById('usuarios-content').innerHTML = `
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Alta</th><th>Acciones</th></tr>
          </thead>
          <tbody>${filas}</tbody>
        </table>
      </div>`;

    // Botones editar
    document.querySelectorAll('[data-edit]').forEach(btn => {
      btn.addEventListener('click', () => {
        const u = data.usuarios.find(x => x.id === parseInt(btn.dataset.edit));
        if (u) abrirEditar(u);
      });
    });

    // Botones eliminar
    document.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm(`¿Eliminar al usuario "${btn.dataset.nombre}"? Esta acción no se puede deshacer.`)) return;
        const r = await auth.apiFetch(`/api/usuarios/${btn.dataset.del}`, { method: 'DELETE' });
        const d = await r.json();
        if (d.ok) { showToast('Usuario eliminado', 'success'); cargar(); }
        else       showToast('Error al eliminar', 'error');
      });
    });
  }

  // ── Modal ─────────────────────────────────────────────────────
  function cerrarModal() {
    document.getElementById('modal-overlay').style.display = 'none';
    editandoId = null;
  }
  document.getElementById('modal-close').addEventListener('click',  cerrarModal);
  document.getElementById('modal-cancel').addEventListener('click', cerrarModal);
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-overlay')) cerrarModal();
  });

  document.getElementById('btn-nuevo').addEventListener('click', () => {
    editandoId = null;
    document.getElementById('modal-title').textContent     = 'Nuevo usuario';
    document.getElementById('modal-confirm').textContent   = 'Crear';
    document.getElementById('campo-usuario').style.display = '';
    document.getElementById('pwd-hint').style.display      = 'none';
    document.getElementById('pwd-label').innerHTML         =
      'Contraseña <span style="color:var(--danger)">*</span>';
    document.getElementById('f-usuario').value  = '';
    document.getElementById('f-nombre').value   = '';
    document.getElementById('f-password').value = '';
    document.getElementById('f-rol').value      = 'operador';
    document.getElementById('modal-overlay').style.display = 'flex';
    document.getElementById('f-usuario').focus();
  });

  function abrirEditar(u) {
    editandoId = u.id;
    document.getElementById('modal-title').textContent     = `Editar — ${u.usuario}`;
    document.getElementById('modal-confirm').textContent   = 'Guardar';
    document.getElementById('campo-usuario').style.display = 'none';
    document.getElementById('pwd-hint').style.display      = '';
    document.getElementById('pwd-label').innerHTML         = 'Nueva contraseña';
    document.getElementById('f-nombre').value   = u.nombre || '';
    document.getElementById('f-password').value = '';
    document.getElementById('f-rol').value      = u.rol;
    document.getElementById('modal-overlay').style.display = 'flex';
    document.getElementById('f-nombre').focus();
  }

  document.getElementById('modal-confirm').addEventListener('click', async () => {
    const nombre   = document.getElementById('f-nombre').value.trim();
    const password = document.getElementById('f-password').value;
    const rol      = document.getElementById('f-rol').value;
    const btn      = document.getElementById('modal-confirm');

    btn.disabled = true;

    if (editandoId === null) {
      // Crear
      const usuario = document.getElementById('f-usuario').value.trim();
      if (!usuario || !password) {
        showToast('Usuario y contraseña son obligatorios', 'warning');
        btn.disabled = false;
        return;
      }
      const r = await auth.apiFetch('/api/usuarios', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario, nombre, password, rol }),
      });
      const d = await r.json();
      if (d.ok) {
        showToast('Usuario creado', 'success');
        cerrarModal();
        cargar();
      } else {
        showToast(d.motivo === 'usuario_existente' ? 'Ese usuario ya existe' : 'Error al crear', 'error');
      }
    } else {
      // Editar
      const body = { nombre, rol };
      if (password) body.password = password;
      const r = await auth.apiFetch(`/api/usuarios/${editandoId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const d = await r.json();
      if (d.ok) {
        showToast('Usuario actualizado', 'success');
        cerrarModal();
        cargar();
      } else {
        showToast('Error al guardar', 'error');
      }
    }

    btn.disabled = false;
  });

  cargar();
</script>

</body>
</html>
